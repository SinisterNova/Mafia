function mini(){

function rocket(){
  app.innerHTML=`<h2>ROCKET DEFENSE</h2><div class="tm" id="tm"></div><p>Drag or use the arrow keys / A and D to move. Your rocket fires automatically. Destroy <b id="cnt">0/12</b> drones. 3 hits and you reboot!</p><canvas id="cv" width="360" height="480" style="width:100%;max-width:360px;touch-action:none;border:1px solid var(--cy);background:#05020fcc;box-shadow:0 0 24px #19f0ff44"></canvas><p id="mr"></p>`;
  const cv=$('#cv'),x=cv.getContext('2d'),W=360,H=480,keys={};
  let ship=W/2,bul=[],en=[],kills=0,lives=3,t=0,done=false,msg=0;
  const stars=Array.from({length:35},()=>[Math.random()*W,Math.random()*H,Math.random()*2+.5]);
  const move=e=>{const r=cv.getBoundingClientRect();ship=Math.max(18,Math.min(W-18,(e.clientX-r.left)/r.width*W))};
  cv.addEventListener('pointermove',move);cv.addEventListener('pointerdown',move);
  const kd=e=>{if(!cv.isConnected){document.removeEventListener('keydown',kd);document.removeEventListener('keyup',ku);return}keys[e.key.toLowerCase()]=1;if(e.key.startsWith('Arrow'))e.preventDefault()};
  const ku=e=>{keys[e.key.toLowerCase()]=0};
  document.addEventListener('keydown',kd);document.addEventListener('keyup',ku);
  miniT=setInterval(()=>{
    if(done)return;t++;
    if(keys.arrowleft||keys.a)ship-=5;if(keys.arrowright||keys.d)ship+=5;
    ship=Math.max(18,Math.min(W-18,ship));
    if(t%12===0)bul.push([ship,H-50]);
    if(t%28===0)en.push([20+Math.random()*(W-40),-20,1.2+Math.random()*.7]);
    bul.forEach(b=>b[1]-=8);en.forEach(e=>e[2]&&(e[1]+=e[2]));
    bul=bul.filter(b=>{for(const e of en){if(!e.dead&&Math.abs(b[0]-e[0])<18&&Math.abs(b[1]-e[1])<18){e.dead=1;return false}}return b[1]>-10});
    kills+=en.filter(e=>e.dead).length;en=en.filter(e=>!e.dead);
    en=en.filter(e=>{if(e[1]>H-20||(Math.abs(e[0]-ship)<20&&e[1]>H-70)){lives--;return false}return true});
    if(lives<=0){kills=0;lives=3;en=[];bul=[];msg=40}
    if(kills>=12){done=true;clearInterval(miniT);$('#mr').textContent='ALL DRONES DESTROYED \u2714 Waiting for the others\u2026';db.doc(`lobbies/${code}/m/${uid}`).set({g:S.gid,r:S.round,ok:1})}
    x.clearRect(0,0,W,H);x.fillStyle='#fff';
    stars.forEach(s=>{s[1]=(s[1]+s[2])%H;x.globalAlpha=.6;x.fillRect(s[0],s[1],s[2],s[2])});x.globalAlpha=1;
    x.fillStyle='#ff2a8a';bul.forEach(b=>x.fillRect(b[0]-2,b[1],4,12));
    x.font='28px serif';en.forEach(e=>x.fillText('\ud83d\udc7e',e[0]-14,e[1]+10));
    if(!done)x.fillText('\ud83d\ude80',ship-14,H-20);
    if(msg>0){msg--;x.fillStyle='#ff2a4d';x.font='20px Orbitron,sans-serif';x.fillText('SHIP DOWN \u2013 REBOOTING',60,H/2)}
    $('#cnt').textContent=kills+'/12 '+'\u2764'.repeat(Math.max(lives,0));
  },33);
}
/* ---------- host engine (the host's browser runs the game) ---------- */
const who=r=>Object.keys(G.roles).find(u=>G.roles[u]===r);
function go(phase,dur,x={}){clearTimeout(T);G.phase=phase;G.seq=(G.seq??S.seq??0)+1;Object.assign(G,x);L().update({phase,dur,seq:G.seq,...x});T=setTimeout(adv,dur*1000)}
function start(){
  const ids=Object.keys(P);
  const rs=['mafia','detective','doctor',...Array(ids.length-3).fill('crew')];
  for(let i=rs.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[rs[i],rs[j]]=[rs[j],rs[i]]}
  const roles={};ids.forEach((u,i)=>roles[u]=rs[i]);
  G={...S,roles,alive:ids,saved:[],round:1,n:ids.length,gid:Date.now(),m:null,d:null};
  S.seq=S.seq||0;
  go('roles',8,{roles,alive:ids,saved:[],round:1,n:ids.length,gid:G.gid,dawn:null,rev:null,clue:null,winner:null});
}
function pick(r){const u=who(r),a=A[u];
  if(!a||a.g!==G.gid||a.r!==G.round||a.ph!==r||!G.alive.includes(a.t))return null;
  if(r==='doctor'&&G.saved.includes(a.t))return null;
  if(r!=='doctor'&&a.t===u)return null;return a.t}
function night(ph){go(ph,G.alive.includes(who(ph))?20:8)}
function over(){
  let w=null;if(!G.alive.includes(who('mafia')))w='crew';else if(G.alive.length<=2)w='mafia';
  if(w){go('end',3600,{winner:w});return true}return false}
function next(){G.round++;if(G.round>G.n)return go('end',3600,{winner:'mafia'});G.m=G.d=null;go('night',4,{round:G.round})}
function adv(){
  if(!isHost()||!G)return;clearTimeout(T);clearTimeout(G.dt);G.dt=null;const p=G.phase;
  if(p==='roles')return go('night',4);
  if(p==='night')return night('mafia');
  if(p==='mafia'){G.m=pick('mafia');return night('doctor')}
  if(p==='doctor'){G.d=pick('doctor');if(G.d)G.saved.push(G.d);return night('detective')}
  if(p==='detective'){
    let dawn={k:'quiet'};
    if(G.m){if(G.m===G.d)dawn={k:'saved',u:G.m};else{G.alive=G.alive.filter(x=>x!==G.m);dawn={k:'slain',u:G.m}}}
    return go('dawn',7,{dawn,alive:G.alive,saved:G.saved})}
  if(p==='dawn'){if(over())return;return go('meeting',90)}
  if(p==='meeting'){
    const cnt={};G.alive.forEach(u=>{const a=A[u];if(a&&a.g===G.gid&&a.r===G.round&&a.ph==='meeting'&&a.t&&a.t!=='skip'&&G.alive.includes(a.t))cnt[a.t]=(cnt[a.t]||0)+1});
    const e=Object.entries(cnt).sort((a,b)=>b[1]-a[1]);let rev={none:1};
    if(e.length&&(e.length===1||e[0][1]>e[1][1])){const u=e[0][0];G.alive=G.alive.filter(x=>x!==u);rev={u,role:G.roles[u]}}
    return go('reveal',7,{rev,alive:G.alive})}
  if(p==='reveal'){if(over())return;return(G.round===3||G.round===6)?go('mini',60):next()}
  if(p==='mini'){
    const mc=COL.find(c=>c[0]===P[who('mafia')].color);
    const all=miniDone();
    const clue=all?(G.round===3?`Intel decrypted: the Mafia’s colour is a ${mc[2]==='w'?'WARM':'COOL'} tone.`:`Intel decrypted: the Mafia’s colour name starts with a letter from ${mc[0][0]<='M'?'A to M':'N to Z'}.`):'The firewall held. Not everyone cleared the breach, so no intel was recovered.';
    return go('clue',7,{clue})}
  if(p==='clue')return next();
}
const miniDone=()=>G.alive.filter(u=>u!==who('mafia')).every(u=>M[u]&&M[u].g===G.gid&&M[u].r===G.round);
function hostCheck(){
  if(!isHost()||!G)return;const p=G.phase;
  if(['mafia','doctor'].includes(p)&&G.alive.includes(who(p))&&pick(p))adv();
  else if(p==='detective'&&G.alive.includes(who(p))&&pick(p)){if(!G.dt)G.dt=setTimeout(()=>{if(G&&G.phase==='detective')adv()},7000)}
  else if(p==='meeting'&&G.alive.every(u=>A[u]&&A[u].g===G.gid&&A[u].r===G.round&&A[u].ph==='meeting'))adv();
